<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Лікарі</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<header>
    <div>
        <a th:href="@{/}">🏥 Clinic</a>
        <a th:href="@{/ui/departments}">Відділення</a>
        <a th:href="@{/ui/doctors}">Лікарі</a>
        <a th:href="@{/ui/patients}">Пацієнти</a>
        <a th:href="@{/ui/appointments}">Записи на прийом</a>
    </div>
    <a th:href="@{/logout}">Вийти</a>
</header>
<main>
    <h1>Лікарі</h1>
    <a class="btn" th:href="@{/ui/doctors/new}">+ Додати лікаря</a>

    <table>
        <thead>
        <tr><th>ID</th><th>ПІБ</th><th>Спеціалізація</th><th>Відділення</th><th>Email</th><th>Дії</th></tr>
        </thead>
        <tbody>
        <tr th:each="d : ${doctors}">
            <td th:text="${d.id}"></td>
            <td th:text="${d.firstName} + ' ' + ${d.lastName}"></td>
            <td th:text="${d.specialization}"></td>
            <td th:text="${d.departmentName}"></td>
            <td th:text="${d.email}"></td>
            <td>
                <a class="btn btn-secondary" th:href="@{/ui/doctors/{id}/edit(id=${d.id})}">Редагувати</a>
                <form class="inline" th:action="@{/ui/doctors/{id}/delete(id=${d.id})}" method="post"
                      onsubmit="return confirm('Видалити лікаря?');">
                    <button class="btn btn-danger" type="submit">Видалити</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
